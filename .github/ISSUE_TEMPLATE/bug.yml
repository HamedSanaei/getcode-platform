name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: correlation
    attributes:
      label: Correlation/order identifiers (redacted)
      description: Never paste secrets, OTPs, tokens or raw SMS bodies.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
