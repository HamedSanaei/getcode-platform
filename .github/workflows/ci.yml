name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref so latest result always wins.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Install exactly the SDK pinned by global.json (M00-001 baseline).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked mode)
        run: dotnet restore GetCode.sln --locked-mode /p:ContinuousIntegrationBuild=true
      - name: Format check
        run: dotnet format GetCode.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build GetCode.sln -c Release --no-restore
      - name: Vulnerable NuGet package audit
        run: |
          set -euo pipefail
          dotnet list GetCode.sln package --vulnerable --include-transitive | tee nuget-audit.txt
          ! grep -q "has the following vulnerable packages" nuget-audit.txt
      - name: Test
        run: dotnet test GetCode.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Deterministic lockfile install (M00-001). npm ci fails when
      # package-lock.json and package.json disagree.
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      # M01-004: token snapshot schema + drift gate (fails if Penpot export or tokens.css changed without regeneration)
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          GETCODE_PRIMARY_HOST: getcode.example
          GETCODE_PLUSPREMIUM_HOST: vnumber.pluspremium.ir
          GETCODE_CANONICAL_HOST: getcode.example
          INTERNAL_API_URL: http://127.0.0.1:8080
